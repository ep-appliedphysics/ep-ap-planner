<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>APPLIED PHYSICS | COURSE PLANNER</title>
    <meta
      name="description"
      content="Plan a Johns Hopkins Engineering for Professionals Applied Physics M.S. — cores, concentrations, and semester-by-semester course bubbles."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./index-Dp8R7qwy.js"></script>
    <link rel="stylesheet" crossorigin href="./index-cQHv76cZ.css">
    <style>
      header h1 {
        font-size: 1.35rem !important;
        line-height: 1.2 !important;
        letter-spacing: 0.04em !important;
      }
      @media (min-width: 768px) {
        header h1 { font-size: 1.6rem !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function applyCopyFixes() {
        const h1 = document.querySelector("header h1");
        if (h1) h1.textContent = "APPLIED PHYSICS | COURSE PLANNER";
        document.querySelectorAll("footer p").forEach((p) => {
          if (p.textContent.includes("Canvas Files") || p.textContent.includes("Blank planner HTML")) {
            p.innerHTML =
              'Course pages open on <a class="text-gold underline-offset-2 hover:underline" href="https://ep.jhu.edu/programs/applied-physics/">ep.jhu.edu</a>. Students can export an HTML or JSON copy of their plan and import it later to restore progress.';
          }
        });
        document.querySelectorAll("*").forEach((el) => {
          if (el.children.length) return;
          const t = (el.textContent || "").trim();
          if (t === "Host on Canvas" || t === "Blank planner HTML") {
            const hide = el.closest("[role='menuitem']") || el.parentElement || el;
            hide.style.display = "none";
          }
        });
      }
      new MutationObserver(applyCopyFixes).observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    </script>
  </body>
</html>
